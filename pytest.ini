[pytest]
testpaths = tests
# src/ no es un paquete instalable: los scripts se importan por nombre
# (igual que list_s1_items importa flood_monitor). Esto pone src/ en
# sys.path sin necesidad de tocarlo desde conftest.
pythonpath = src
markers =
    network: consulta la API de Planetary Computer (requiere internet);
        saltear con -m "not network"

# Config por región/AOI para flood_validation.
#
# Clave = string EXACTO de --region (el mismo valor que flood_monitor.py usa
# para geocodificar con Nominatim y para su run-tag). "default" es el
# fallback si --region no matchea ninguna entrada.
#
# susceptibility.source_root: raíz de outputs/<region>/ del repo hermano
# meteorologia-flood-projections (no vive en este repo — ver su CLAUDE.md).
# La ruta relativa de acá asume que ambos repos están clonados como
# hermanos bajo el mismo directorio padre, que es como están hoy en este
# entorno. La resolución de qué ciclo puntual usar (Fase 5) todavía no
# corre en Fase 1 — esto solo declara dónde buscar.

regions:
  "Región de Coquimbo, Chile":
    display_name: "Coquimbo"
    map_center: null   # null = centroide del AOI
    zoom: 12
    susceptibility:
      source_root: "../meteorologia-flood-projections/outputs/coquimbo"
      sufijo_preferido: gfs
    datasets:
      sentinel1: true
      sentinel2: true
      dynamic_world: false
    hand_threshold_m: 5.0
    awei_variant: sh
    confidence_threshold: 0.5

  "Región de Atacama, Chile":
    display_name: "Atacama"
    map_center: null
    zoom: 12
    susceptibility:
      source_root: "../meteorologia-flood-projections/outputs/atacama"
      sufijo_preferido: gfs
    datasets:
      sentinel1: true
      sentinel2: true
      dynamic_world: false
    hand_threshold_m: 5.0
    awei_variant: sh
    confidence_threshold: 0.5

default:
  display_name: "default"
  map_center: null
  zoom: 11
  susceptibility:
    source_root: null   # sin producto conocido: --susceptibility es obligatorio
    sufijo_preferido: gfs
  datasets:
    sentinel1: true
    sentinel2: true
    dynamic_world: false
  hand_threshold_m: 5.0
  awei_variant: sh
  confidence_threshold: 0.5

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una corrida por rama: si empujás dos veces seguidas, la primera se cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    name: pytest (sin red)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Una sola fuente de verdad para la versión: .python-version (3.12.4),
      # el mismo archivo que usa pyenv en local.
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # Deliberadamente NO instalamos requirements.txt: rasterio, rioxarray,
      # geopandas y leafmap necesitan GDAL del sistema (apt) y tardan minutos.
      # La suite offline no los toca porque flood_monitor.py importa las
      # librerías pesadas *dentro* de las funciones; a nivel de módulo solo
      # necesita numpy. Lo demás son wheels puras: shapely para el AOI,
      # scikit-image para Otsu y remove_small_objects, requests para
      # geocode_place (se mockea, pero hay que poder importarlo), y pyyaml
      # para el config loader de flood_validation (config.py también hace el
      # import perezoso, pero los tests offline sí llaman a esas funciones).
      #
      # Ese mínimo es intencional: si alguien sube un import pesado al tope de
      # un módulo, este job falla. Es la red que mantiene los imports perezosos
      # (y con ellos el arranque rápido de list_s1_items.py y el --help).
      - name: Instalar dependencias mínimas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "numpy>=1.26" "shapely>=2.0" \
                      "scikit-image>=0.24" "requests>=2.32" "pyyaml>=6.0"

      # `network` consulta Planetary Computer: fuera de CI para no depender de
      # un servicio externo ni de su latencia (corrélos en local con
      # `pytest -m network` antes de tocar la búsqueda). `raster` necesita
      # rioxarray y va en el job de abajo, para no meter GDAL acá.
      - name: pytest -m "not network and not raster"
        run: pytest -m "not network and not raster"

  # Job aparte, y no dependencias extra en el de arriba, justamente para no
  # perder esa alarma: acá sí hay rioxarray, así que un import pesado a nivel
  # de módulo pasaría desapercibido. Los dos jobs corren en paralelo.
  raster:
    name: pytest (rásters, sin red)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # rioxarray arrastra rasterio y geopandas arrastra pyogrio: las dos
      # traen GDAL embebido en sus ruedas manylinux, así que sigue sin hacer
      # falta `apt install gdal-bin libgdal-dev`, que es lo que tarda minutos.
      # leafmap queda fuera a propósito: el mapa HTML ya degrada suave si no
      # está, y arrastra medio ecosistema de folium.
      - name: Instalar dependencias de ráster
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "numpy>=1.26" "shapely>=2.0" \
                      "scikit-image>=0.24" "rioxarray>=0.15" \
                      "geopandas>=1.0" "matplotlib>=3.9" "requests>=2.32"

      # Escriben GeoTIFF sintéticos a disco y ejercitan el código real
      # (clip_box, reproject_match, gradiente, dilatación, vectorización y la
      # reproyección a EPSG:4326). Sin red.
      - name: pytest -m raster
        env:
          MPLBACKEND: Agg   # sin pantalla en el runner
        run: pytest -m raster
